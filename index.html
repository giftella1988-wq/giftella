<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Giftella</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Fredoka:wght@600&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#FFF6FB;--card:#fff;--ink:#2B2A5C;--muted:#6B6A8F;--line:#F0DDF0;--pink:#F15BB5;--pur:#9B5DE5;--blue:#4DA6FF;--yel:#FFD23F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1530;--card:#262046;--ink:#f6efff;--muted:#b9b0d9;--line:#3b3263}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;max-width:1000px;margin:auto}
.logo{font:600 30px Fredoka,Cairo,sans-serif;direction:ltr;-webkit-text-stroke:1px #fff;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.cartbtn{border:0;background:linear-gradient(90deg,var(--pink),var(--pur));color:#fff;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.hero{max-width:964px;margin:6px auto 0;padding:0 18px}
.hero img{width:100%;display:block;border-radius:22px}
.hero a{display:block;width:max-content;margin:14px auto 0;background:var(--yel);color:#2b2a5c;font-weight:800;padding:9px 26px;border-radius:999px;text-decoration:none}
main{max-width:1000px;margin:auto;padding:20px 18px 80px}
h2{font-size:26px;margin:4px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:4px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pur);border-color:var(--pur);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:150px;display:grid;place-items:center;font-size:56px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:10px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.info small{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-weight:800;font-size:18px}
.add{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:6px 14px;font-weight:700;cursor:pointer}
.tag{margin-top:24px;background:var(--yel);color:#2b2a5c;border-radius:18px;padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tag .lbl{background:#fff;border:3px dashed var(--pink);border-radius:10px;padding:6px 16px;font-weight:800;font-size:20px;transform:rotate(-3deg)}
.tag p{margin:0;flex:1;min-width:200px;font-weight:600}
aside{position:fixed;inset:0 auto 0 0;width:min(340px,100%);background:var(--card);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;z-index:20}
aside.open{transform:none}
aside h3{margin:0 0 8px;font-size:24px}#items{flex:1;overflow:auto}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.line button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:28px;height:28px;cursor:pointer}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:10px 0}
.send{display:block;text-align:center;background:#25D366;color:#073b1b;font-weight:800;border-radius:12px;padding:10px;text-decoration:none}
.send.off{opacity:.45;pointer-events:none}
.empty,.note{color:var(--muted);padding:12px 0;font-size:14px}
footer{text-align:center;color:var(--muted);padding:18px;font-size:14px}
.admin{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--bg);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.admin span{flex:1 1 100%}.admin button{border:0;border-radius:9px;padding:5px 12px;font-weight:700;cursor:pointer;background:var(--yel);color:#2b2a5c}
.admin button:disabled{opacity:.5}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:18px;padding:18px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;font-weight:600;margin-top:8px}
dialog input{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
#f_pv img{width:90px;height:90px;object-fit:cover;border-radius:12px;margin-top:6px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btns button{border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;background:var(--line);color:var(--ink)}
.btns .ok{background:var(--pur);color:#fff}.btns .del{background:#F94144;color:#fff}
@media(prefers-reduced-motion:reduce){aside{transition:none}}

   var bm=await createImageBitmap(f),k=Math.min(1,700/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
   var bl=await new Promise(function(r){c.toBlob(r,'image/jpeg',.78)}),r=as?await as.upload(bl):{url:await new Promise(function(z){var fr=new FileReader();fr.onload=function(){z(fr.result)};fr.readAsDataURL(bl)})};img=r.url;$('f_pv').innerHTML='<img src="'+esc(r.url)+'" alt="">';st('تم رفع الصورة ✓')}catch(e){st('تعذر رفع الصورة، جرّب صورة أصغر')}};
 $('f_ok').onclick=function(){var n=$('f_n').value.trim(),pr=parseFloat($('f_p').value);if(!n||isNaN(pr)||pr<0){st('اكتب الاسم والسعر');return}
  p.n=n;p.c=$('f_c').value.trim()||'هدايا';p.p=pr;if(img)p.img=img;if(nw)S.products.push(p);dirty=true;dlg.close();render()};
 if(!nw)$('f_del').onclick=function(){if(!arm){arm=true;this.textContent='تأكيد الحذف';return}S.products=S.products.filter(function(x){return x.id!==p.id});dirty=true;dlg.close();render()}}
function setP(){dlg.innerHTML='<label for="f_t">رقم الواتساب (مثال: 01012345678)</label><input id="f_t" type="tel" inputmode="tel" value="'+esc(S.phone||'')+'"><div class="btns"><button class="ok" id="f_ok">حفظ</button><button id="f_no">إلغاء</button></div>';dlg.showModal();
 $('f_no').onclick=function(){dlg.close()};$('f_ok').onclick=function(){S.phone=$('f_t').value.trim();dirty=true;dlg.close();render()}}
async function pub(){var b=$('pubbtn');b.textContent='جاري التجهيز...';b.disabled=true;try{var a=window.claude?await claude.use('artifact'):null;if(!a){var u=URL.createObjectURL(new Blob([doc()],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download='index.html';document.body.appendChild(l);l.click();l.remove();b.textContent='تم التنزيل. ارفعي الملف على الموقع';b.disabled=false;dirty=false;return}await a.publish(doc())}catch(e){b.textContent='تعذر الحفظ، جرّب تاني';b.disabled=false}}
root.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,id=+t.dataset.id;
 if(a==='cat'){cur=t.dataset.v;render()}else if(a==='add'){cart[id]=(cart[id]||0)+1;upd()}
 else if(a==='inc'){cart[id]++;upd()}else if(a==='dec'){cart[id]--;if(!cart[id])delete cart[id];upd()}
 else if(a==='open'){isOpen=true;$('cart').classList.add('open')}else if(a==='close'){isOpen=false;$('cart').classList.remove('open')}
 else if(a==='edit')editP(id);else if(a==='new')editP(0);else if(a==='set')setP();else if(a==='pub')pub()});
if(location.hash==='#admin')own=true;render();
if(window.claude&&claude.use)claude.use('user').then(function(u){if(u&&(u.isOwner()||u.canEdit())){own=true;render()}}).catch(function(){});
